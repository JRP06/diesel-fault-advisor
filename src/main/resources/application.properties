spring.application.name=dieselfaultadvisor

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.com.truckadvisor.dieselfaultadvisor=INFO
logging.level.org.springframework.web=INFO

# watsonx.ai Configuration
# Set these values via environment variables for security:
# - WATSONX_API_KEY: Your IBM Cloud API key
# - WATSONX_PROJECT_ID: Your watsonx.ai project ID
watsonx.api-key=${WATSONX_API_KEY:your-api-key-here}
watsonx.project-id=${WATSONX_PROJECT_ID:your-project-id-here}
watsonx.url=${WATSONX_URL:https://us-south.ml.cloud.ibm.com}
watsonx.model-id=${WATSONX_MODEL_ID:ibm/granite-3-8b-instruct}

# watsonx.ai Model Parameters
watsonx.max-tokens=${WATSONX_MAX_TOKENS:1000}
watsonx.temperature=${WATSONX_TEMPERATURE:0.7}
watsonx.top-p=${WATSONX_TOP_P:1.0}
watsonx.top-k=${WATSONX_TOP_K:50}
watsonx.repetition-penalty=${WATSONX_REPETITION_PENALTY:1.0}
